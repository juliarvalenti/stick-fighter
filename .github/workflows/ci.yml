name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  DOTNET_VERSION: 8.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  sim-tests:
    name: Build, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Format
        run: dotnet format StickFighter.sln --verify-no-changes
      # Warnings are errors, so this also runs the .NET analyzers and the
      # determinism analyzers (SF0001 floats, SF0002 unordered iteration, RS0030 banned APIs).
      - name: Build
        run: dotnet build StickFighter.sln
      - name: Tests
        # A test stuck in a loop fails after 2 minutes instead of holding the runner.
        run: dotnet test StickFighter.sln --no-build --blame-hang-timeout 2m
      # The determinism gate: every recorded match must replay to the same checksum on every frame.
      - name: Replays
        run: dotnet run --no-build --project tools/ReplayRunner -- check replays
      # The rollback gate (GGPO's SyncTest): every frame of every recorded match, rolled back 1 to 8
      # frames and resimulated, on the same inputs and after a misprediction, must come out the same.
      - name: SyncTest
        run: dotnet run --no-build --project tools/ReplayRunner -- synctest replays
      # Compiled move data must match the scripts it's compiled from, and pass the body checks.
      - name: Move data is up to date
        run: dotnet run --no-build --project tools/MoveCompiler -- --check

  perf:
    name: Perf benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Every round of this change must stay within the p99 budgets. On a PR that changes what the
      # simulation runs, the base branch is measured too, on the same runner, in rounds that
      # alternate with this change's so drift on the machine hits both alike; then the medians
      # are compared. The base is built with this change's harness, so only the simulation differs.
      - name: Benchmark
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ROUNDS: 5
        run: |
          out="$RUNNER_TEMP/bench"
          mkdir -p "$out/base" "$out/head"
          dotnet build -c Release tools/Bench -o "$out/bin-head"

          compare=false
          if [ -z "$BASE_SHA" ]; then
            echo "not a pull request: budget check only"
          elif git diff --quiet "$BASE_SHA" HEAD -- src/Sim data tools/Bench; then
            echo "src/Sim, data and tools/Bench are unchanged from the base: budget check only"
          else
            git worktree add ../base "$BASE_SHA"
            rm -rf ../base/tools/Bench
            cp -R tools/Bench ../base/tools/Bench
            if dotnet build -c Release ../base/tools/Bench -o "$out/bin-base"; then
              compare=true
            else
              echo "::warning::the base doesn't build with this change's harness; skipping the regression check"
            fi
          fi

          status=0
          for round in $(seq 1 "$ROUNDS"); do
            if $compare; then
              echo "::group::round $round: base"
              dotnet "$out/bin-base/StickFighter.Bench.dll" --out "$out/base/$round.json" || true
              echo "::endgroup::"
            fi
            echo "::group::round $round: this change"
            dotnet "$out/bin-head/StickFighter.Bench.dll" --out "$out/head/$round.json" || status=1
            echo "::endgroup::"
          done

          if $compare; then
            dotnet "$out/bin-head/StickFighter.Bench.dll" compare --base "$out"/base/*.json --head "$out"/head/*.json || status=1
          fi
          exit $status

  godot-smoke:
    name: Godot headless smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Godot
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/${name}/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - run: dotnet build StickFighter.sln
      - run: $GODOT --headless --import
      - name: Run the main scene headless
        shell: bash  # sets pipefail, so a Godot crash fails the step even through tee
        run: |
          timeout 120 $GODOT --headless --path . --quit-after 600 -- --smoke | tee smoke.log
          grep -q "smoke ok" smoke.log

  scenarios:
    name: Scenarios and golden images
    # Pinned: Mesa comes from this image's apt, and a new rasterizer can shift every golden at once.
    # Bump it deliberately, with tools/update-goldens.sh in the same PR.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Godot and a software OpenGL stack
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/${name}/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - run: dotnet build StickFighter.sln
      - run: $GODOT --headless --import
      # The game renders its own viewport offscreen (Compatibility renderer on Mesa's software
      # rasterizer) and compares each capture with tests/golden/. No one's screen is involved.
      - name: Render scenarios and compare with goldens
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          out="$RUNNER_TEMP/scenarios"
          names=$($GODOT --headless --path . -- --list-scenarios | sed -n 's/^scenario-name //p')
          status=0
          for name in $names; do
            echo "::group::$name"
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" \
              $GODOT --path . --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --fixed-fps 60 \
              -- --scenario "$name" --out "$out" --golden tests/golden || status=1
            echo "::endgroup::"
          done
          exit $status
      # Reviewers open these instead of a build. tools/update-goldens.sh copies them into tests/golden/.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenarios
          path: ${{ runner.temp }}/scenarios
          retention-days: 30

  macos-build:
    name: macOS build
    runs-on: macos-latest
    needs: [sim-tests, godot-smoke, perf, scenarios]
    # Pushes to main, or run by hand (workflow_dispatch) to try the export on a branch.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable.mono
          key: godot-templates-mono-${{ env.GODOT_VERSION }}
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_mono.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q templates.tpz -d templates
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dest"
          mv templates/templates/* "$dest/"
      # Replays on arm64 macOS too, so the cross-platform determinism check runs both ways.
      - name: Replays
        run: dotnet run --project tools/ReplayRunner -- check replays
      - run: $GODOT --headless --import
      - name: Export
        run: |
          mkdir -p build
          $GODOT --headless --export-release "macOS" build/StickFighter.zip
          test -s build/StickFighter.zip
      # Proves the exported artifact itself starts, not just the editor build.
      - name: Launch check on the exported app
        shell: bash  # pipefail, so a crash fails the step even through tee
        run: |
          mkdir -p build/app
          unzip -q build/StickFighter.zip -d build/app
          "build/app/Stick Fighter.app/Contents/MacOS/Stick Fighter" --headless -- --smoke | tee build/launch.log
          grep -q "smoke ok" build/launch.log
      # The zip keeps the app's executable bits, which a bare .app upload would lose.
      - uses: actions/upload-artifact@v4
        with:
          name: StickFighter-macOS-${{ github.sha }}
          path: build/StickFighter.zip
          retention-days: 30
